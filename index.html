<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Stole the Sun?</title>
<meta name="description" content="Six towns, six missing miniature suns. A pocket detective notebook: read the exhibits, cross-check timelines, mark your board and name the culprit. EN/FR/ES.">
<style>
:root{
  --paper:#f6efdc; --paper2:#efe4c8; --card:#fbf6e9; --ink:#33291f; --ink2:#7a6a52;
  --red:#c8402e; --sun:#e8930c; --sun2:#f5b731; --line:#e3d5b6;
  --acc:#f0d47a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--ink); line-height:1.45;
  background:
    radial-gradient(1200px 500px at 85% -10%, #fdf7e2 0%, rgba(253,247,226,0) 60%),
    repeating-linear-gradient(0deg, transparent 0 30px, rgba(131,106,68,.07) 30px 31px),
    linear-gradient(180deg, var(--paper) 0%, var(--paper2) 100%);
  min-height:100vh;
}
body::before{content:""; position:fixed; inset:0; pointer-events:none;
  background:linear-gradient(90deg, transparent 0 26px, rgba(200,64,46,.16) 26px 28px, transparent 28px);}
.wrap{max-width:980px; margin:0 auto; padding:14px 16px 90px; position:relative}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif; letter-spacing:.2px}
/* ---- top bar ---- */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  max-width:980px; margin:0 auto; padding:12px 16px 4px}
.brand{display:flex; align-items:center; gap:10px; background:none; border:none; padding:4px 6px; text-align:left}
.brand-txt{font-family:Georgia,serif; font-weight:700; font-size:1.05rem; line-height:1.1}
.brand-txt small{display:block; font-family:inherit; font-weight:400; color:var(--ink2); font-size:.72rem}
.ctrl{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.lang{display:flex; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden}
.lang-b{background:var(--card); border:none; padding:5px 10px; font-weight:700; font-size:.8rem}
.lang-b.cur{background:var(--ink); color:var(--card)}
.icon-b,.ghost-b{background:var(--card); border:1.5px dashed var(--ink2); border-radius:8px; padding:5px 10px}
.ghost-b:hover,.icon-b:hover{border-color:var(--ink)}
/* ---- home ---- */
.hero{margin:18px 0 8px; text-align:center}
.hero h1{font-size:clamp(1.15rem, 3.4vw, 1.7rem); margin:0; color:var(--ink)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin:14px 0}
.case-card{position:relative; display:flex; flex-direction:column; gap:4px; text-align:left;
  background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:38px 14px 14px;
  box-shadow:2px 3px 0 rgba(51,41,31,.12); transition:transform .12s ease, box-shadow .12s ease}
.case-card:hover{transform:translateY(-2px); box-shadow:3px 5px 0 rgba(51,41,31,.16)}
.case-card.done{outline:2px solid var(--acc); outline-offset:-6px}
.cc-band{position:absolute; top:0; left:0; right:0; height:26px; background:var(--acc); border-radius:10px 10px 0 0}
.cc-num{font-size:.72rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink2)}
.finale-b{background:var(--red); color:#fff; border-radius:6px; padding:0 6px; font-size:.66rem; letter-spacing:1px}
.cc-title{font-family:Georgia,serif; font-size:1.18rem; font-weight:700}
.cc-town{color:var(--ink2); font-size:.85rem; font-style:italic}
.cc-foot{margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.cc-open{margin-left:auto; color:var(--red); font-weight:700; font-size:.9rem}
.suns{letter-spacing:2px}
.sun-dot{opacity:.22; font-size:.95rem}
.sun-dot.on{opacity:1; filter:saturate(1.2)}
.star{color:#d8cdb2; font-size:1.05rem}
.star.on{color:var(--sun)}
.mini-stamp{display:inline-block; border:2px solid var(--red); color:var(--red); border-radius:6px;
  padding:0 7px; font-weight:800; font-size:.7rem; letter-spacing:1.5px; transform:rotate(-4deg); text-transform:uppercase}
.mini-stamp.big{font-size:.95rem; padding:2px 10px}
.all-done{text-align:center; font-weight:700; color:var(--red)}
.credit{text-align:center; color:var(--ink2); font-size:.75rem; margin-top:26px}
/* ---- method ---- */
.sheet{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:18px; margin-top:14px}
.sheet p{font-size:.98rem}
/* ---- case ---- */
.case-head{margin-top:8px}
.case-title h2{margin:2px 0; font-size:clamp(1.2rem,3.5vw,1.6rem)}
.case-town{color:var(--ink2); font-size:.85rem}
.case-intro{background:var(--card); border-left:4px solid var(--acc); border-radius:0 10px 10px 0;
  padding:10px 12px; margin:10px 0 0; font-size:.95rem; box-shadow:1px 2px 0 rgba(51,41,31,.08)}
.tries{color:var(--red); font-size:.82rem; margin:6px 0 0; font-weight:700}
.tabbar{display:flex; gap:6px; overflow-x:auto; margin:14px 0 10px; padding-bottom:2px}
.tab-b{flex:0 0 auto; background:var(--card); border:1.5px solid var(--line); border-radius:10px 10px 0 0;
  padding:8px 13px; font-weight:700; font-size:.9rem; border-bottom:none; opacity:.75}
.tab-b.cur{opacity:1; background:var(--card); border-color:var(--ink); border-bottom:2px solid var(--card);
  position:relative; top:1.5px}
.tab-body{background:var(--card); border:1.5px solid var(--ink); border-radius:0 12px 12px 12px; padding:14px; min-height:220px}
.tab-h{margin:2px 0 10px; font-size:1.02rem}
/* suspects */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.sus-card,.pl-card{background:#fffdf6; border:1.5px solid var(--line); border-radius:12px; padding:10px; text-align:center;
  box-shadow:1px 2px 0 rgba(51,41,31,.08)}
.sus-face{display:flex; justify-content:center}
.sus-name{font-weight:800; margin-top:2px}
.sus-role{color:var(--ink2); font-size:.78rem}
.sus-note{font-size:.78rem; font-style:italic; color:var(--ink); opacity:.8; margin:4px 0 6px}
.pl-pin{font-size:1.4rem}
.sus-marks{display:flex; gap:4px; justify-content:center; flex-wrap:wrap}
.mk{border:1.5px solid var(--ink2); background:var(--card); border-radius:8px; padding:2px 7px; font-size:.72rem; display:inline-flex; gap:3px; align-items:center}
.mk.cell{padding:4px 9px; font-size:.95rem}
.mk.cur[data-v="yes"]{background:#2f6b43; border-color:#2f6b43; color:#fff}
.mk.cur[data-v="maybe"]{background:var(--sun); border-color:var(--sun); color:var(--ink)}
.mk.cur[data-v="no"]{background:var(--red); border-color:var(--red); color:#fff}
/* timeline */
.tl{list-style:none; margin:0; padding:0 0 0 8px; border-left:2.5px dashed var(--ink2)}
.tl-ev{position:relative; padding:4px 0 10px 18px}
.tl-ev::before{content:""; position:absolute; left:-8px; top:10px; width:12px; height:12px; border-radius:50%;
  background:var(--sun2); border:2.5px solid var(--ink)}
.tl-t{font-weight:800; font-variant-numeric:tabular-nums; margin-right:8px; background:var(--paper2); border-radius:6px; padding:1px 7px; font-size:.85rem}
.tl-x{font-size:.94rem}
/* clues */
.clues{display:grid; gap:10px}
.clue{background:#fffdf6; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; transition:box-shadow .3s}
.clue.flash{box-shadow:0 0 0 4px var(--sun2)}
.clue-top{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
.clue-no{font-weight:800; font-size:.8rem; letter-spacing:1px; text-transform:uppercase; color:var(--red)}
.clue-type{font-size:.72rem; font-weight:800; letter-spacing:.5px; text-transform:uppercase; border-radius:6px; padding:1px 8px; color:#fff}
.t-alibi .clue-type{background:#2f6b43}.t-testimony .clue-type{background:#3a7ca5}
.t-object .clue-type{background:#b8860b}.t-report .clue-type{background:#5c6b7a}
.t-claim .clue-type{background:#a05a2c}.t-info .clue-type{background:#8f2b6b}
.clue-src{color:var(--ink2); font-size:.82rem; font-weight:700; margin-top:2px}
.clue-txt{margin:6px 0 0; font-size:.95rem}
/* board */
.board-note{color:var(--ink2); font-size:.85rem; margin:4px 0 10px}
.board{width:100%; border-collapse:collapse; font-size:.9rem}
.board th{font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--ink2); text-align:center}
.board td{border-top:1.5px dashed var(--line); padding:6px 4px}
.board-sep td{border-top:2px solid var(--ink); font-weight:800; letter-spacing:1px; text-transform:uppercase; font-size:.78rem; background:linear-gradient(90deg,var(--acc),transparent)}
.bd-name small{display:block; color:var(--ink2); font-size:.72rem}
.bd-cell{text-align:center}
.bd-mini{display:inline-flex; vertical-align:middle}
/* action bar */
.actionbar{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(246,239,220,0), var(--paper) 30%);
  display:flex; gap:10px; justify-content:center; align-items:center; padding:14px 12px calc(12px + env(safe-area-inset-bottom)); z-index:20}
.main-b{background:var(--red); color:#fff; border:2px solid #8f2b1e; border-radius:10px; padding:10px 20px; font-weight:800; box-shadow:2px 3px 0 rgba(51,41,31,.25)}
.main-b:active{transform:translateY(1px)}
.main-b:disabled{opacity:.45; cursor:not-allowed}
/* modal */
.veil{position:fixed; inset:0; background:rgba(51,41,31,.45); display:flex; align-items:flex-start; justify-content:center;
  overflow:auto; padding:20px 12px; z-index:50}
.modal{background:var(--card); border:2px solid var(--ink); border-radius:14px; max-width:640px; width:100%; padding:16px; box-shadow:4px 6px 0 rgba(51,41,31,.3); margin:auto}
.modal h3{margin:0 0 8px}
.m-sec{font-weight:800; margin:12px 0 6px; font-size:.9rem; letter-spacing:.4px}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px}
.pick-b{display:flex; align-items:center; gap:6px; background:#fffdf6; border:2px solid var(--line); border-radius:10px; padding:6px 8px; text-align:left}
.pick-b small{display:block; color:var(--ink2); font-size:.7rem}
.pick-b.wide{grid-column:span 1; font-size:.85rem}
.pick-b.cur{border-color:var(--red); outline:2px solid var(--sun2)}
.judge{background:#fff3d6; border:2px dashed var(--red); border-radius:10px; padding:10px; font-weight:700; margin:12px 0 0}
.m-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap}
.m-hint{color:var(--ink2); font-size:.8rem; margin:8px 0 0}
.hints{padding-left:18px}
.hint-li{margin:8px 0; background:#fffdf6; border-left:4px solid var(--sun); padding:8px 10px; border-radius:0 8px 8px 0}
/* solution */
.solution{margin-top:10px}
.sol-head{display:flex; flex-wrap:wrap; align-items:center; gap:12px; justify-content:center; text-align:center}
.sol-head h2{margin:0; font-size:clamp(1.1rem,3.2vw,1.5rem); width:100%}
.stamp{border:3.5px double var(--red); color:var(--red); border-radius:8px; padding:4px 18px; font-weight:900;
  letter-spacing:4px; font-size:1.1rem; transform:rotate(-6deg); text-transform:uppercase; background:rgba(255,253,246,.6)}
.sol-grid{display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; margin:16px 0;
  background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px}
.sol-por{text-align:center}
.sol-por b{display:block; font-size:1.1rem}
.sol-por span{color:var(--ink2); font-size:.85rem}
.sol-summary p{margin:4px 0}
.steps{padding-left:20px}
.steps li{margin:10px 0}
.refs{display:inline-flex; gap:4px; flex-wrap:wrap; margin-left:4px}
.refchip{border:1.5px solid var(--ink2); background:var(--paper2); border-radius:6px; font-size:.72rem; padding:1px 7px; font-weight:700}
.refchip:hover{border-color:var(--red); color:var(--red)}
.epi{background:var(--card); border-left:4px solid var(--sun); padding:10px 12px; border-radius:0 10px 10px 0; font-style:italic}
@media (max-width:600px){
  .wrap{padding:10px 10px 100px}
  .picks{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
  .tab-b{padding:8px 10px; font-size:.82rem}
  .board{font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<header id="app-head"></header>
<div id="app"></div>

<script>
/* Qui a volé le Soleil ? — données des 6 affaires.
 * Couche formelle (langue-indépendante) :
 *   clues[].excl  : suspects exclus par cet indice (rival du coupable)
 *   clues[].exclP : lieux exclus comme scène du vol
 *   solution      : { thief, place, clue }
 * Invariants (vérifiés par les tests) :
 *   I1 tout rival est exclu par ≥ 1 indice ; I2 le coupable n'est jamais exclu ;
 *   I3 tout lieu non-solution est exclu ; I4 l'indice décisif exclut ≥ 1 rival
 *   qu'aucun autre indice n'exclut (nécessaire) ; I5 la scène n'est jamais exclue. */
"use strict";
const CASES = [
{
  id: "case1", diff: 1, finale: false, town: "Brumarelle",
  title: { en: "The Well Sun", fr: "Le soleil du puits", es: "El sol del pozo" },
  intro: {
    en: "A miniature sun warmed the well square of Brumarelle. This morning its little cradle hangs empty. Five neighbours were around. One of them took it.",
    fr: "Un soleil miniature réchauffait la place du puits de Brumarelle. Ce matin, son petit berceau est vide. Cinq voisins étaient dans le coin. L'un d'eux l'a pris.",
    es: "Un sol en miniatura calentaba la plaza del pozo de Brumarelle. Esta mañana su pequeña cuna está vacía. Cinco vecinos estaban cerca. Uno de ellos se lo llevó."
  },
  suspects: [
    { id: "s1", name: "Odette", face: { skin: "#f2c9a0", shirt: "#e8a7b4", hair: "#8a5a33", hat: "chef", extra: "blush" },
      role: { en: "The baker", fr: "La boulangère", es: "La panadera" },
      note: { en: "Up before dawn, every day.", fr: "Debout avant l'aube, chaque jour.", es: "En pie antes del alba, cada día." } },
    { id: "s2", name: "Firmin", face: { skin: "#eab68a", shirt: "#7fa8d9", hair: "#4a3626", hat: "cap", extra: "none" },
      role: { en: "The postman", fr: "Le facteur", es: "El cartero" },
      note: { en: "Knows every path around town.", fr: "Connaît tous les chemins du village.", es: "Conoce todos los caminos del pueblo." } },
    { id: "s3", name: "Zéphirin", face: { skin: "#f2c9a0", shirt: "#a8c6b0", hair: "#9b9b9b", hat: "hood", extra: "none" },
      role: { en: "The bell keeper", fr: "Le guetteur du clocher", es: "El vigilante del campanario" },
      note: { en: "Claims he sees everything from up there.", fr: "Jure qu'il voit tout depuis là-haut.", es: "Jura que lo ve todo desde allá arriba." } },
    { id: "s4", name: "Mélusine", face: { skin: "#eab68a", shirt: "#c9b8e0", hair: "#d87838", hat: "flower", extra: "glasses" },
      role: { en: "The bookseller", fr: "La libraire", es: "La librera" },
      note: { en: "Reads aloud every morning.", fr: "Lit à voix haute chaque matin.", es: "Lee en voz alta cada mañana." } },
    { id: "s5", name: "Barbouille", face: { skin: "#f2c9a0", shirt: "#f0d47a", hair: "#5d3a1f", hat: "beret", extra: "paint" },
      role: { en: "The painter", fr: "Le peintre", es: "El pintor" },
      note: { en: "Repaints the kiosk every spring.", fr: "Repeint le kiosque chaque printemps.", es: "Repinta el quiosco cada primavera." } }
  ],
  places: [
    { id: "p2", name: { en: "The bakery", fr: "La boulangerie", es: "La panadería" } },
    { id: "p1", name: { en: "The well square", fr: "La place du puits", es: "La plaza del pozo" } },
    { id: "p3", name: { en: "The bell tower", fr: "Le clocher", es: "El campanario" } },
    { id: "p4", name: { en: "The library", fr: "La bibliothèque", es: "La biblioteca" } }
  ],
  timeline: [
    { t: "06:30", txt: { en: "Odette lights the oven; its glow is seen from the square.", fr: "Odette allume le four ; sa lueur se voit depuis la place.", es: "Odette enciende el horno; su resplandor se ve desde la plaza." } },
    { t: "07:00", txt: { en: "Zéphirin rings the morning bell. The little sun glitters above the well.", fr: "Zéphirin sonne le réveil. Le petit soleil scintille au-dessus du puits.", es: "Zéphirin toca la campana matinal. El solito brilla sobre el pozo." } },
    { t: "08:10", txt: { en: "A ladder is raised against the well (seen from the tower).", fr: "Une échelle est dressée contre le puits (vue du clocher).", es: "Se apoya una escalera contra el pozo (vista desde el campanario)." } },
    { t: "08:15", txt: { en: "A cloud covers the square for ten minutes.", fr: "Un nuage couvre la place pendant dix minutes.", es: "Una nube cubre la plaza durante diez minutos." } },
    { t: "08:30", txt: { en: "Firmin comes back from the mill for his low-town round.", fr: "Firmin revient du moulin pour sa tournée basse-ville.", es: "Firmin vuelve del molino para su ronda del barrio bajo." } },
    { t: "09:00", txt: { en: "Mélusine finds the cradle empty and raises the alarm.", fr: "Mélusine découvre le berceau vide et donne l'alerte.", es: "Mélusine descubre la cuna vacía y da la voz de alarma." } }
  ],
  clues: [
    { id: "k1", type: "alibi", src: { en: "Odette, corroborated", fr: "Odette, corroborée", es: "Odette, corroborada" },
      txt: { en: "“I never left the bakery between six and nine — the morning queue never leaves the oven.” Six customers confirm it.",
             fr: "« Je n'ai pas quitté la boulangerie entre 6 h et 9 h : la file du matin ne quitte pas le four. » Six clients confirment.",

    { id: "k2", type: "testimony", src: { en: "The miller", fr: "Le meunier", es: "El molinero" },
      txt: { en: "“Firmin waited at the mill for his mail sack at 8 sharp; he only walked back down at 8:25.”",
             fr: "« Firmin attendait son sac de lettres au moulin à 8 h pile ; il n'est redescendu qu'à 8 h 25. »",
             es: "«Firmin esperaba su saco de cartas en el molino a las 8 en punto; no bajó hasta las 8:25.»" },
      excl: ["s2"], exclP: [] },
    { id: "k3", type: "report", src: { en: "Story hour record", fr: "Registre de l'heure du conte", es: "Registro de la hora del cuento" },
      txt: { en: "Twelve children certify that Mélusine read aloud at the library from 8 to 9.",
             fr: "Douze enfants certifient que Mélusine lisait à voix haute à la bibliothèque de 8 h à 9 h.",

      excl: ["s4"], exclP: [] },
    { id: "k4", type: "claim", src: { en: "Zéphirin's statement", fr: "Déclaration de Zéphirin", es: "Declaración de Zéphirin" },
      txt: { en: "“From the tower I saw a ladder raised against the well around 8:10. I thought someone was cleaning the rim.” No one corroborates the rest of his morning.",
             fr: "« Du clocher, j'ai vu dresser une échelle contre le puits vers 8 h 10. J'ai cru à un nettoyage de la margelle. » Personne ne corrobore le reste de sa matinée.",
             es: "«Desde el campanario vi cómo se apoyaba una escalera contra el pozo hacia las 8:10. Pensé que limpiaban el brocal.» Nadie corrobora el resto de su mañana." },
      excl: [], exclP: ["p2", "p3", "p4"] },
    { id: "k5", type: "report", src: { en: "Scene report", fr: "Constat de scène", es: "Informe de la escena" },
      txt: { en: "The little sun's cradle, at the top of the well, is empty. The abandoned ladder bears paint drops that are still soft.",
             fr: "Le berceau du petit soleil, au sommet du puits, est vide. L'échelle abandonnée porte des gouttes de peinture encore molles.",
             es: "La cuna del solito, en lo alto del pozo, está vacía. La escalera abandonada tiene gotas de pintura aún blandas." },
      excl: [], exclP: ["p2", "p3", "p4"] },
    { id: "k6", type: "report", src: { en: "Weather note", fr: "Note du temps", es: "Nota del tiempo" },
      txt: { en: "The 8:15–8:25 cloud was the only moment when the square could be seen from nowhere.",
             fr: "Le nuage de 8 h 15 à 8 h 25 a été le seul moment où la place n'était visible de nulle part.",
             es: "La nube de las 8:15 a las 8:25 fue el único momento en que la plaza no se veía desde ningún sitio." },
      excl: [], exclP: [] },
    { id: "k7", type: "object", src: { en: "Found on the square", fr: "Trouvé sur la place", es: "Hallado en la plaza" },
      txt: { en: "A knocked-over paint pot stains the kiosk pavements, on the same square.",
             fr: "Un pot de peinture renversé macule les pavés du kiosque, sur la même place.",
             es: "Una olla de pintura volcada mancha los adoquines del quiosco, en la misma plaza." },

function validateCase(c) {
  const errs = [];
  const th = c.solution.thief;
  const rivals = c.suspects.filter((s) => s.id !== th).map((s) => s.id);
  for (const r of rivals) if (!c.clues.some((k) => (k.excl || []).includes(r))) errs.push("rival-never-excluded:" + r);
  for (const k of c.clues) {
    if ((k.excl || []).includes(th)) errs.push("thief-excluded:" + k.id);
    if ((k.exclP || []).includes(c.solution.place)) errs.push("scene-excluded:" + k.id);
  }
  for (const p of c.places) {
    if (p.id === c.solution.place) continue;
    if (!c.clues.some((k) => (k.exclP || []).includes(p.id))) errs.push("place-never-excluded:" + p.id);
  }
  const d = byId(c.clues, c.solution.clue);
  if (!d) errs.push("decisive-missing");
  else {
    if ((d.excl || []).includes(th)) errs.push("decisive-excludes-thief");
    const needed = (d.excl || []).some((sid) => !c.clues.some((k) => k.id !== d.id && (k.excl || []).includes(sid)));
    if (!needed) errs.push("decisive-not-necessary");

  if (c.hints.length !== 3) errs.push("hints-count:" + c.hints.length);
  return errs;
}

/* ---------- audio ---------- */
let AC = null;
function beep(freq, dur, type, gain, when) {
  if (!S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(AC.destination);
    const t0 = AC.currentTime + (when || 0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.08, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.15));
    o.start(t0); o.stop(t0 + (dur || 0.15) + 0.05);
  } catch (e) { /* audio absent : silencieux */ }
}
const SND = {
  click: () => beep(660, 0.05, "triangle", 0.05),
  page: () => beep(320, 0.09, "triangle", 0.04),
  wrong: () => { beep(392, 0.16, "sine", 0.09); beep(311, 0.22, "sine", 0.09, 0.14); },
  hint: () => { beep(523, 0.1, "sine", 0.06); beep(784, 0.14, "sine", 0.05, 0.1); },
  stamp: () => { beep(196, 0.14, "square", 0.05); beep(98, 0.2, "sine", 0.08, 0.02); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, "sine", 0.07, i * 0.11))
};

/* ---------- logique d'accusation ---------- */
function accuseResult(c, sId, pId, kId) {
  const sol = c.solution;
  const ok = sId === sol.thief && pId === sol.place && kId === sol.clue;
  let msg = null, clueRef = null;
  if (!ok && sId !== sol.thief) {
    const hit = c.clues.find((k) => (k.excl || []).includes(sId));
    if (hit) { msg = "judgeWrong"; clueRef = clueNo(c, hit.id); }
    else msg = "judgeClose";
  } else if (!ok) msg = "judgeClose";
  return { ok, msg, clueRef };
}
function starsFor(wrong, hints) { return hints === 0 && wrong <= 1 ? 3 : hints <= 2 && wrong <= 3 ? 2 : 1; }

  root.innerHTML = renderHeader() + `<main class="wrap">${inner}</main>` + renderModal();
  document.documentElement.lang = S.lang;
  const t = { home: "Qui a volé le Soleil ?", fr: "Qui a volé le Soleil ?", es: "¿Quién robó el Sol?" };
  document.title = S.lang === "en" ? "Who Stole the Sun?" : t[S.lang];
}

/* ---------- interactions ---------- */
function submitAccusation() {
  const c = caseById(S.caseId);
  const p = prog(c.id);
  if (!(S.acc.s && S.acc.p && S.acc.k)) return { ok: false, msg: null, clueRef: null };
  const res = accuseResult(c, S.acc.s, S.acc.p, S.acc.k);
  if (res.ok) {
    p.solved = true;
    p.stars = starsFor(p.wrong, p.hints);
    SND.stamp(); setTimeout(SND.win, 250);
    S.screen = "solution"; S.modal = null; S.banner = null;
    saveState();
  } else {
    p.wrong++;
    SND.wrong();
    let msg = fmt(res.msg, res.clueRef ? { n: res.clueRef } : {});
    if (p.wrong >= 2 && p.hints < 3) msg += " " + T(UI.judgeNudge);
    S.banner = msg;
    saveState();
  }
  return res;
}

function onAction(el) {
  const a = el.getAttribute("data-action");
  const c = S.caseId ? caseById(S.caseId) : null;
  const p = c ? prog(c.id) : null;
  switch (a) {
    case "noop": break;
    case "home": SND.page(); S.screen = "home"; S.modal = null; S.banner = null; break;
    case "method": SND.page(); S.screen = "method"; break;
    case "lang": S.lang = el.getAttribute("data-l"); SND.click(); saveState(); break;
    case "sound": S.sound = !S.sound; SND.click(); saveState(); break;
    case "open": {
      SND.page();
      S.caseId = el.getAttribute("data-id");
      const pr = prog(S.caseId);
      S.screen = pr.solved ? "solution" : "case";
      S.tab = "suspects"; S.acc = { s: null, p: null, k: null }; S.banner = null; S.modal = null;
      break;
    }
    case "tab": SND.click(); S.tab = el.getAttribute("data-tab"); break;
    case "mark": {
      SND.click();
      const id = el.getAttribute("data-id"), v = el.getAttribute("data-v");
      p.marks[id] = p.marks[id] === v ? "" : v;
      saveState(); break;
    }
    case "hint": SND.hint(); S.modal = "hint"; break;
    case "reveal-hint": {
      if (p.hints < 3 && !p.solved) { p.hints++; SND.hint(); saveState(); }
      break;
    }
    case "accuse": SND.click(); S.modal = "accuse"; S.banner = null; break;
    case "closemodal": SND.click(); S.modal = null; S.banner = null; break;
    case "pick": {
      SND.click();
      const k = el.getAttribute("data-k");
      S.acc[k] = el.getAttribute("data-v");
      break;
    }
    case "accuse-go": {
      if (!(S.acc.s && S.acc.p && S.acc.k)) break;
      submitAccusation();
      break;
    }
    case "goto-evidence": {
      SND.click();
      S.tab = "evidence"; S.screen = "case"; S.modal = null;
      render();
      const n = clueNo(c, el.getAttribute("data-clue"));
      const elx = document.querySelectorAll(".clue")[n - 1];
      if (elx) { elx.scrollIntoView({ behavior: "smooth", block: "center" }); elx.classList.add("flash"); setTimeout(() => elx.classList.remove("flash"), 1600); }
      return;
    }
    case "tab-case": SND.page(); S.screen = "case"; S.tab = "evidence"; break;
    case "solution": SND.page(); S.screen = "solution"; break;
    case "reset": {
      if (window.confirm(T(UI.resetAsk))) { S.progress = {}; SND.page(); saveState(); }
      break;
    }
  }
  render();
}
function boot() {
  loadState();
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  try { if (!localStorage.getItem(LS_KEY) && ["en", "fr", "es"].includes(nav)) S.lang = nav; } catch (e) { }
  render();
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    if (el.getAttribute("data-action") === "closemodal" && ev.target.closest(".modal")) return;
    ev.preventDefault();
    onAction(el);
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.modal) { S.modal = null; render(); } });
  if (typeof window !== "undefined") {
    window.__SV = {
      state: () => JSON.parse(JSON.stringify({ lang: S.lang, screen: S.screen, caseId: S.caseId, tab: S.tab, acc: S.acc, progress: S.progress, banner: S.banner })),
      setLang: (l) => { S.lang = l; render(); },
      open: (id) => { S.caseId = id; S.screen = prog(id).solved ? "solution" : "case"; render(); },
      tab: (t) => { S.tab = t; render(); },
      accuse: (s, p2, k) => accuseResult(caseById(S.caseId), s, p2, k),
      accuseGo: (s, pl, k) => { S.acc = { s, p: pl, k }; return submitAccusation(); },
      hint: () => { const p = prog(S.caseId); if (p.hints < 3) { p.hints++; saveState(); render(); } },
      mark: (id, v) => { const p = prog(S.caseId); p.marks[id] = v; saveState(); render(); },
      reset: () => { S.progress = {}; saveState(); render(); },
      validate: () => CASES.map((c) => ({ id: c.id, errs: validateCase(c) })),
      cases: CASES
    };
  }
}
if (typeof document !== "undefined" && document.getElementById("app")) boot();

</script>
